services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    volumes: ["./backend/app:/code/app", "./ml:/code/ml"]
  frontend:
    build: ./frontend
    env_file: .env
    depends_on: [backend]
    ports: ["5173:5173"]
    volumes: ["./frontend/src:/app/src"]
volumes:
  pgdata:
